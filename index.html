<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style><title>Monky Niort 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: plein écran — scène 3D à gauche, panneau tarifs à droite (empilé sur mobile). Look unique "maquette de nuit". */
:root{
  --bg:#121116; --panel:#1b1a21; --panel2:#25242d; --line:#34323e;
  --fg:#f4f3f7; --muted:#a7a5b4; --banana:#38d1d3; --banana-ink:#04201f; --pink:#ff5c8a;
  --ok:#5fd39b; --warn:#ffb15c;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.stage{position:relative;min-width:0;overflow:hidden}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:absolute;top:12px;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;z-index:3}
.toolbar > *{pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:12px}.brand .logo{height:40px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}.brand .sub span{color:var(--pink)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button,.btn{font:600 12.5px var(--body);color:var(--muted);background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--banana);color:var(--banana-ink)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.btn:hover,.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]:hover{color:var(--banana-ink)}
.btn[aria-pressed="true"]{border-color:var(--banana);color:var(--banana)}
#rotL,#rotR{font-size:16px;line-height:1;padding:6px 11px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--banana);outline-offset:2px}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;font:600 11.5px var(--body);background:rgba(23,21,42,.86);border:1px solid var(--c);color:var(--fg);padding:3px 8px 3px 6px;border-radius:8px;display:flex;gap:6px;align-items:center;transition:opacity .2s}
.lbl i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.lbl b{color:var(--banana);font-variant-numeric:tabular-nums}
.lbl.dim{opacity:.35}
.lbl.spot{--c:var(--fg);background:var(--fg);color:var(--bg);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;cursor:default;padding:3px 8px}
.lbl.sel{background:var(--banana);color:var(--banana-ink);border-color:var(--banana);font-size:13px;z-index:5}
.lbl.sel b{color:var(--banana-ink)}
.legend{position:absolute;left:16px;bottom:12px;z-index:3;font-size:11.5px;color:var(--muted);background:rgba(23,21,42,.8);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pass{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.eyebrow{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.passrow{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--muted)}
.chip b{color:var(--fg);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 6px}
.filters button{font:600 12px var(--body);background:var(--panel2);color:var(--muted);border:1px solid transparent;border-radius:999px;padding:4px 10px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--banana);color:var(--banana)}
.list{overflow:auto;padding:4px 8px 8px;flex:1;min-height:0}
.item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:8px;border-radius:10px;cursor:pointer;font:500 13.5px var(--body)}
.item:hover{background:var(--panel2)}
.item[aria-current="true"]{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--banana)}
.item i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.item small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.item .p{font-variant-numeric:tabular-nums;color:var(--banana);font-weight:600;font-size:13px}
.item .p.na{color:var(--muted);font-weight:500;font-size:12px}
.detail{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:10px;max-height:52%;overflow:auto}
.detail h2{margin:0;font:800 24px/1.05 var(--display);text-wrap:balance}
.detail .lvl{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--c);color:#16131f}
.detail p{margin:0;color:var(--muted);line-height:1.45}
.facts{display:flex;flex-wrap:wrap;gap:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:7px 0;border-bottom:1px dashed var(--line);vertical-align:baseline}
td:last-child{text-align:right;font-weight:600;color:var(--banana);white-space:nowrap;padding-left:12px}
td small{color:var(--muted);font-weight:400}
td input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 6px;font:inherit}
td input.num{width:76px;text-align:right}
a.price{color:var(--banana);text-decoration:none;border-bottom:1px dotted currentColor}
a.price:hover{border-bottom-style:solid}
a.price span{font-size:.85em;opacity:.8}
.note{font-size:12px;color:var(--warn)}
.src{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.src a{color:var(--banana)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);padding:6px 0}
.toast{position:absolute;bottom:14px;right:16px;z-index:4;background:var(--ok);color:#06210f;font-weight:600;padding:8px 12px;border-radius:8px}
@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto}
  .stage{height:58vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  .detail{max-height:none}
  .list{max-height:320px}
  .brand{font-size:17px;width:100%}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.lbl{transition:none}}
</style>

(function(){let c=Z.resto.c;pl(0xffc070,2.2,30,c.x,3.6,c.z);c=Z.bowling.c;pl(0xb8d8ff,2,46,c.x,6,c.z);c=Z.laser.c;pl(0x9a4dff,3,34,c.x,2.6,c.z);c=Z.jump.c;pl(0xff4fd8,1.6,30,c.x,3.4,c.z);c=Z.karaoke.c;pl(0xff3040,1.6,14,c.x,2.4,c.z);c=Z.kart.c;pl(0x19e3f0,2,60,c.x,6,c.z);c=Z.vr.c;pl(0xb04bff,1.6,16,c.x,2.4,c.z);})();
let night=false;
function setNight(v){night=v;hemi.intensity=v?.32:1;sun.intensity=v?.1:.6;scene.background.set(v?"#0f0d1f":"#17152a");[...lamps,...strips].forEach(s=>s.material=v?lampOn:lampOff);pls.forEach(l=>l.intensity=v?l.userData.i:0);document.getElementById("lights").setAttribute("aria-pressed",v);}

/* ---------- Caméra ---------- */
const ISO_T = new THREE.Vector3(0,0,0);
cam.position.set(ISO_T.x+70,70,ISO_T.z+70); cam.zoom=1; ctr.target.copy(ISO_T);
function resize(){const w=host.clientWidth||1,h=host.clientHeight||1;renderer.setSize(w,h,false);const asp=w/h;VIEW = asp<1?Math.min(110,64/asp):58;cam.left=-VIEW*asp;cam.right=VIEW*asp;cam.top=VIEW;cam.bottom=-VIEW;cam.updateProjectionMatrix();}
window.addEventListener("resize",resize); resize();
let tw=null;
function fly(target,zoom,dirIso){const from={t:ctr.target.clone(),p:cam.position.clone(),z:cam.zoom};const off = dirIso? new THREE.Vector3(70,70,70) : cam.position.clone().sub(ctr.target).setLength(100);const to={t:target.clone(),p:target.clone().add(off),z:zoom};const t0=performance.now(),D=RM?1:650;tw=(now)=>{let k=Math.min(1,(now-t0)/D);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;ctr.target.lerpVectors(from.t,to.t,k);cam.position.lerpVectors(from.p,to.p,k);cam.zoom=from.z+(to.z-from.z)*k;cam.updateProjectionMatrix();if(k>=1)tw=null;};}

/* ---------- Tarifs (défauts + base partagée) ---------- */
const over = {}; let dbRef=null, canWrite=false, editing=false;
/* Tarifs embarqués (bloc <script id="tarifs-data"> mis à jour par scripts/build.py depuis tarifs.json) */
(function(){try{const el=document.getElementById("tarifs-data");if(!el)return;const d=JSON.parse(el.textContent);
  if(Array.isArray(d.pass)&&d.pass.length)PASS.splice(0,PASS.length,...d.pass);
  Object.entries(d.activites||{}).forEach(([id,v])=>{if(Array.isArray(v.lignes))over[id]={lignes:v.lignes,maj:d.maj,src:d.source||"tarifs.json"};});}catch(e){}})();
const eur = p => (Math.round(p*100)/100).toFixed(2).replace(".",",")+" €";
function tarifs(a){return (over[a.id]&&Array.isArray(over[a.id].lignes))?over[a.id].lignes:a.t;}
function minP(a){const ps=tarifs(a).filter(t=>!t.x&&!/chaussure|chaussette|cagoule|suppl/i.test(t.l||"")).map(t=>t.p).filter(p=>typeof p==="number"&&p>0);return ps.length?Math.min(...ps):null;}
function maxP(a){const ps=tarifs(a).filter(t=>!t.x).map(t=>t.p).filter(p=>typeof p==="number"&&p>0);return ps.length?Math.max(...ps):null;}
function priceTxt(a,m){return a.range&&maxP(a)>m?"dès "+eur(m)+" · jusqu'à "+eur(maxP(a)):"dès "+eur(m);}
function majOf(a){const o=over[a.id];return o&&o.maj?{d:o.maj,src:o.src||"base partagée"}:{d:RELEVE,src:"dépliant Tarifs 2026 Niort"};}
const fmtD = d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});}catch(e){return d;}};

/* ---------- UI ---------- */
const listEl=document.getElementById("list"), detEl=document.getElementById("detail"), lblEl=document.getElementById("labels");
let filter="all", sel=null;
document.getElementById("passrow").innerHTML = PASS.map(p=>`<span class="chip">${p.l} <b>${eur(p.p)}</b></span>`).join("")+`<span class="chip">Inclus : Bowling, Laser Game, Kid Park, Jump Park, Karaoké</span><span class="chip">-50 % : Karting, Pixel, Réalité virtuelle, Rival Quiz</span>`;
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList();});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function renderList(){
  listEl.innerHTML = A.filter(a=>filter==="all"||a.cat===filter).map(a=>{const m=minP(a);return `<button class="item" data-id="${a.id}" style="--c:${a.col}" ${sel===a.id?'aria-current="true"':''}><i></i><span>${esc(a.nom)}<small>${CATS[a.cat]}</small></span><span class="p ${m==null?"na":""}">${a.tag?esc(a.tag):m==null?esc((tarifs(a)[0]||{}).txt||""):priceTxt(a,m)}</span></button>`;}).join("");
  listEl.querySelectorAll(".item").forEach(b=>b.onclick=()=>select(b.dataset.id));
}
function renderDetail(){
  if(!sel){detEl.innerHTML=`<div class="eyebrow">Mode d'emploi</div><p>Choisissez une activité dans la liste ou cliquez une zone de la maquette pour la situer dans le parc et voir ses tarifs.</p><p>Ouvert 7j/7 : lun.–jeu. 11 h – 00 h, ven. 11 h – 01 h, sam. 10 h – 02 h, dim. 10 h – 00 h (10 h en vacances scolaires et jours fériés). La Galerie Niort, 79180 Chauray.</p><div class="src"><span>Tarifs du dépliant 2026, relevés le ${fmtD(RELEVE)}</span><a href="${U}" target="_blank" rel="noopener">monky.fr</a></div>`;return;}
  const a=Z[sel].a, T=tarifs(a), m=majOf(a);
  const rows = editing
    ? T.map((t,i)=>`<tr><td><input id="el-${i}" value="${esc(t.l)}" aria-label="Libellé ${i+1}"></td><td><input class="num" id="ep-${i}" inputmode="decimal" value="${t.p==null?"":String(t.p).replace(".",",")}" placeholder="${esc(t.txt||"sur place")}" aria-label="Prix ${i+1}"></td></tr>`).join("")
    : T.map(t=>`<tr><td>${esc(t.l)}${t.u?` <small>${esc(t.u)}</small>`:""}</td><td><a class="price" href="${a.url}" target="_blank" rel="noopener" title="Voir ${esc(a.nom)} sur monky.fr">${t.p==null?esc(t.txt||"sur place"):eur(t.p)}<span aria-hidden="true"> ↗</span></a></td></tr>`).join("");
  detEl.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center"><span class="lvl" style="--c:${a.col}">${CATS[a.cat]}</span><button class="btn" id="close">Fermer</button></div>
  <h2>${esc(a.nom)}</h2><p>${esc(a.d)}</p>
  <div class="facts">${a.f.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}</div>
  ${T.length?`<table><tbody>${rows}</tbody></table>`:""}${a.tag?`<a class="chip price" href="${a.url}" target="_blank" rel="noopener" style="justify-self:start">Se règle en <b>${esc(a.tag)}</b><span aria-hidden="true"> ↗</span></a>`:""}
  ${a.note?`<div class="note">${esc(a.note)}</div>`:""}
  <div class="src"><span>${T.length?`Tarifs au ${fmtD(m.d)} · ${esc(m.src)}`:""}</span><a href="${a.url}" target="_blank" rel="noopener">Voir sur monky.fr</a></div>
  ${canWrite&&T.length?(editing?`<div class="row"><button class="btn" id="save" style="border-color:var(--banana);color:var(--banana)">Enregistrer les tarifs</button><button class="btn" id="cancel">Annuler</button></div>`:`<div class="row"><button class="btn" id="edit">Modifier les tarifs</button></div>`):""}`;
  detEl.querySelector("#close").onclick=()=>select(null);
  const e=detEl.querySelector("#edit"); if(e) e.onclick=()=>{editing=true;renderDetail();};
  const c=detEl.querySelector("#cancel"); if(c) c.onclick=()=>{editing=false;renderDetail();};
  const s=detEl.querySelector("#save"); if(s) s.onclick=save;
}
async function save(){
  const a=Z[sel].a, T=tarifs(a);
  const lignes=T.map((t,i)=>{const l=document.getElementById("el-"+i).value.trim()||t.l;const raw=document.getElementById("ep-"+i).value.trim().replace(",",".").replace("€","");const p=raw===""?null:Number(raw);const o={l,p:isFinite(p)?p:null};if(t.u)o.u=t.u;if(t.x)o.x=1;if(o.p==null)o.txt=t.txt||"sur place";return o;});
  try{await dbRef.collection("tarifs").doc(a.id).set({lignes,maj:new Date().toISOString().slice(0,10),src:"saisie manuelle"});editing=false;toast("Tarifs enregistrés");}
  catch(err){canWrite=false;toast("Enregistrement impossible : droits insuffisants ou base indisponible");editing=false;renderDetail();}
}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600);}

/* Étiquettes 3D */
const L={};
A.forEach(a=>{const d=document.createElement("div");d.className="lbl";d.style.setProperty("--c",a.col);d.onclick=()=>select(a.id);lblEl.appendChild(d);L[a.id]=d;});
function renderLabels(){A.forEach(a=>{const m=minP(a);const d=L[a.id];d.innerHTML=`<i></i>${esc(a.nom)}${(sel===a.id||(!sel&&innerWidth>900))&&m!=null?` <b>dès ${eur(m)}</b>`:""}`;d.classList.toggle("sel",sel===a.id);d.classList.toggle("dim",!!sel&&sel!==a.id);});}
const v=new THREE.Vector3();
const SP=(px,py,y)=>{const c=toM(px,py);return new THREE.Vector3(c[0],y,c[1]);};
const SPOTS=[{t:"Entrée",p:SP(835,1640,3)},{t:"Accueil",p:SP(822,1540,1.8)},{t:"Galerie marchande",p:SP(905,1760,1)}];
const BCL=(function(){const d=document.createElement("div");d.className="lbl";d.style.setProperty("--c","#f5c518");d.innerHTML="<i></i>Bornes Bananacoins <b>tarifs ↗</b>";d.title="Voir les tarifs des jeux d'arcade";d.onclick=()=>select("arcades");lblEl.appendChild(d);return {d,p:SP(921,1582,2.3)};})();
SPOTS.forEach(o=>{const d=document.createElement("div");d.className="lbl spot";d.textContent=o.t;lblEl.appendChild(d);o.d=d;});
function placeLabels(){const w=host.clientWidth,h=host.clientHeight;v.copy(BCL.p).project(cam);BCL.d.style.left=((v.x+1)/2*w)+"px";BCL.d.style.top=((1-v.y)/2*h)+"px";BCL.d.classList.toggle("sel",sel==="arcades");SPOTS.forEach((o,i)=>{o.d.hidden=w<600&&i>0;v.copy(o.p).project(cam);o.d.style.left=((v.x+1)/2*w)+"px";o.d.style.top=((1-v.y)/2*h)+"px";});A.forEach(a=>{const d=L[a.id];v.copy(Z[a.id].c).project(cam);d.hidden=v.z>1||v.z<-1;d.style.left=((v.x+1)/2*w)+"px";d.style.top=((1-v.y)/2*h)+"px";});}

/* Sélection */
function paint(){A.forEach(a=>{const z=Z[a.id];const on=!sel||sel===a.id;z.fm.color.copy(on?z.solC:z.solC.clone().lerp(new THREE.Color("#18171d"),.55));z.fm.emissive.set(sel===a.id?z.base.clone().multiplyScalar(.28):0x000000);z.lm.opacity=on?.9:.25;z.halo.visible=sel===a.id;});}
function select(id){
  sel=id; editing=false;
  if(id){const z=Z[id];const size=Math.max(z.R.x2-z.R.x1,z.R.z2-z.R.z1);fly(new THREE.Vector3(z.c.x,0,z.c.z),Math.min(3.4,Math.max(1.3,56/size)),false);}
  paint();renderList();renderDetail();renderLabels();
}
document.getElementById("iso").onclick=()=>{select(null);fly(ISO_T,1,true);};
document.getElementById("lights").style.display="none";
{const b=document.createElement("button");b.className="btn";b.id="cut";b.textContent="Masquer les murs";b.setAttribute("aria-pressed","false");b.title="Retirer tous les murs pour voir l'intérieur";document.getElementById("lights").before(b);b.onclick=()=>setCut(!cutOn);}
function rotateBy(da){const off=cam.position.clone().sub(ctr.target),a0=Math.atan2(off.x,off.z),r=Math.hypot(off.x,off.z),y=off.y;const t0=performance.now(),D=RM?1:500;
  tw=(now)=>{let k=Math.min(1,(now-t0)/D);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;const a=a0+da*k;cam.position.set(ctr.target.x+Math.sin(a)*r,ctr.target.y+y,ctr.target.z+Math.cos(a)*r);if(k>=1)tw=null;};}
document.getElementById("rotL").onclick=()=>rotateBy(-Math.PI/2);
document.getElementById("rotR").onclick=()=>rotateBy(Math.PI/2);
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,cam);const hits=ray.intersectObjects(pick,false);if(hits.length)select(hits[0].object.userData.id);});

function loop(now){requestAnimationFrame(loop);if(tw)tw(now);animate(now/1000);ctr.update();renderer.render(scene,cam);placeLabels();}
renderList();renderDetail();renderLabels();paint();requestAnimationFrame(loop);
window.__niort={select,setNight,fly,cam,ctr};

/* ---------- Base partagée : tarifs modifiables ---------- */
(async function(){
  try{
    if(!window.claude||!window.claude.use) return;
    const db = await window.claude.use("db"); if(!db) return; dbRef=db;
    const user = await window.claude.use("user");
    let cw = null; try{ cw = user && user.can ? await user.can("data.write") : null; }catch(e){}
    canWrite = cw!==false;
    db.collection("tarifs").onSnapshot(snap=>{snap.docs.forEach(d=>{if(d.exists)over[d.id]=d.data();});snap.docChanges().forEach(c=>{if(c.type==="removed")delete over[c.doc.id];});renderList();renderLabels();if(!editing)renderDetail();},()=>{});
    if(sel===null) renderDetail();
  }catch(e){}
})();
})();

</script>
</body></html>
